# Plain static site (Webflow export): no build step, served from the repo root.
[build]
  publish = "."

[build.environment]
  NODE_VERSION = "22"

# Instagram feed functions (see CLAUDE.md, "Instagram feed")
[functions]
  directory = "netlify/functions"

# Bespoke Florals section pages, which share their names with the folders of product pages
[[redirects]]
  from = "/bespoke-florals/the-ceremony"
  to = "/bespoke-florals/the-ceremony.html"
  status = 200

[[redirects]]
  from = "/bespoke-florals/the-reception"
  to = "/bespoke-florals/the-reception.html"
  status = 200

[[redirects]]
  from = "/bespoke-florals/your-florals"
  to = "/bespoke-florals/your-florals.html"
  status = 200

[[redirects]]
  from = "/bespoke-florals/installations"
  to = "/bespoke-florals/installations.html"
  status = 200

