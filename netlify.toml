# Pages removed in the move from Webflow
[[redirects]]
  from = "/small-props-old"
  to = "/small-props"
  status = 301

[[redirects]]
  from = "/large-props-filter-test"
  to = "/large-props"
  status = 301

[[redirects]]
  from = "/search"
  to = "/"
  status = 301

[[redirects]]
  from = "/test"
  to = "/"
  status = 301

# Pages retired in the rebuild
[[redirects]]
  from = "/commercial-installations"
  to = "/"
  status = 301

[[redirects]]
  from = "/faux-florals"
  to = "/bespoke-florals"
  status = 301

# Earlier Bespoke Florals pages (staging only), now types within the four sections
