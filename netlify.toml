# Plain static site (Webflow export): no build step, served from the repo root.
[build]
  publish = "."

[build.environment]
  NODE_VERSION = "22"

# Instagram feed functions (see CLAUDE.md, "Instagram feed")
[functions]
  directory = "netlify/functions"

# Product list pages that share their name with a folder of product pages (signage.html and signage/),
# so say explicitly which file serves the list.
[[redirects]]
  from = "/signage"
  to = "/signage.html"
  status = 200

[[redirects]]
  from = "/furniture-rugs"
  to = "/furniture-rugs.html"
  status = 200

# Bespoke Florals section pages, which share their names with the folders of product pages
[[redirects]]
  from = "/bespoke-florals/the-ceremony"
  to = "/bespoke-florals/the-ceremony.html"
  status = 200

[[redirects]]
  from = "/bespoke-florals/the-reception"
  to = "/bespoke-florals/the-reception.html"
  status = 200

[[redirects]]
  from = "/bespoke-florals/your-florals"
  to = "/bespoke-florals/your-florals.html"
  status = 200

[[redirects]]
  from = "/bespoke-florals/installations"
  to = "/bespoke-florals/installations.html"
  status = 200

# Hire collection changes (see CLAUDE.md, "Hire collection")
# Furniture and Rugs & Runners are combined into Furniture & Rugs
[[redirects]]
  from = "/furniture"
  to = "/furniture-rugs"
  status = 301

[[redirects]]
  from = "/rugs-runners"
  to = "/furniture-rugs"
  status = 301

[[redirects]]
  from = "/furniture-collection/*"
  to = "/furniture-rugs/:splat"
  status = 301

[[redirects]]
  from = "/rugs-runners-collection/*"
  to = "/furniture-rugs/:splat"
  status = 301

# Florals & Foliage is covered by Bespoke Florals: each product goes to its closest Bespoke Florals product,
# or the Bespoke Florals page
[[redirects]]
  from = "/florals-foliage"
  to = "/bespoke-florals"
  status = 301

[[redirects]]
