# Plain static site (Webflow export): no build step, served from the repo root.
[build]
  publish = "."

[build.environment]
  NODE_VERSION = "22"

# Instagram feed functions (see CLAUDE.md, "Instagram feed")
[functions]
  directory = "netlify/functions"

# Product list pages that share their name with a folder of product pages (signage.html and signage/),
# so say explicitly which file serves the list.
[[redirects]]
  from = "/signage"
  to = "/signage.html"
  status = 200

[[redirects]]
  from = "/florals-foliage"
  to = "/florals-foliage.html"
  status = 200

# Pages removed in the move from Webflow
[[redirects]]
  from = "/small-props-old"
  to = "/small-props"
  status = 301

[[redirects]]
  from = "/large-props-filter-test"
  to = "/large-props"
  status = 301

[[redirects]]
  from = "/search"
  to = "/"
  status = 301

[[redirects]]
  from = "/test"
  to = "/"
  status = 301

# Pages retired in the rebuild
[[redirects]]
  from = "/commercial-installations"
  to = "/"
  status = 301

[[redirects]]
  from = "/faux-florals"
  to = "/bespoke-florals"
  status = 301

# Earlier Bespoke Florals pages (staging only), now types within the four sections
[[redirects]]
  from = "/bespoke-florals/floral-pillars"
  to = "/bespoke-florals/the-ceremony#pillars"
  status = 301

[[redirects]]
  from = "/bespoke-florals/moongates"
  to = "/bespoke-florals/the-ceremony#moongates"
  status = 301

[[redirects]]
  from = "/bespoke-florals/urns-and-plinths"
  to = "/bespoke-florals/the-ceremony#urns-and-plinths"
  status = 301

[[redirects]]
  from = "/bespoke-florals/archways"
  to = "/bespoke-florals/installations#arbors"
  status = 301

[[redirects]]
  from = "/bespoke-florals/custom-installations"
  to = "/bespoke-florals/installations"
  status = 301

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Staging: keep this copy out of Google while the Webflow site is live.
# Remove this block (and the robots meta tag in each page) at launch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
