  status = 301

[[redirects]]
  from = "/bespoke-florals/custom-installations"
  to = "/bespoke-florals/installations"
  status = 301

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Staging: keep this copy out of Google while the Webflow site is live.
# Remove this block (and the robots meta tag in each page) at launch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
