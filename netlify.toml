# Plain static site (Webflow export): no build step, served from the repo root.
[build]
  publish = "."

# Pages removed in the move from Webflow
[[redirects]]
  from = "/small-props-old"
  to = "/small-props"
  status = 301

[[redirects]]
  from = "/large-props-filter-test"
  to = "/large-props"
  status = 301

[[redirects]]
  from = "/search"
  to = "/"
  status = 301

[[redirects]]
  from = "/test"
  to = "/"
  status = 301

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Staging: keep this copy out of Google while the Webflow site is live.
# Remove this block (and the robots meta tag in each page) at launch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
