# Saves the old Webflow site's sitemap to data/webflow-sitemap.xml, so URLs can be matched before launch.
name: Fetch Webflow sitemap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-webflow-sitemap.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the sitemap
        run: curl -fsSL https://www.winterbornehireandstyling.co.uk/sitemap.xml -o data/webflow-sitemap.xml
      - name: Commit it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/webflow-sitemap.xml
          git diff --cached --quiet || { git commit -m "Save the Webflow sitemap"; git push; }
